# Site settings. Content lives in _data/*.json and _projects/*.md and is
# edited from /admin — you normally do not need to touch this file.
title: "Josep Cruañes"
description: "Josep Cruañes is a software developer and PhD researcher at ICN2 working on AI and scientific computing for microscopy, with a background in game development."
url: "https://josepcru.github.io"
baseurl: ""
lang: en

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }

exclude:
  - Readme.txt
  - README.md
  - docs
  - .superpowers
