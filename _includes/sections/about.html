<section id="about" class="section" aria-labelledby="about-title">
  <h2 id="about-title">About</h2>
  <div class="about-grid" data-reveal>
    <img class="about-photo" src="{{ profile.photo | relative_url }}" alt="Portrait of {{ profile.name | escape }}" loading="lazy" decoding="async">
    <div class="about-text">
      {%- assign paragraphs = profile.about | newline_to_br | split: '<br />' %}
      {%- for p in paragraphs %}
      {%- assign text = p | strip %}
      {%- if text != '' %}
      <p>{{ text | escape }}</p>
      {%- endif %}
      {%- endfor %}
      <dl class="facts">
        {%- for f in profile.facts %}
        <div><dt>{{ f.label | escape }}</dt><dd>{{ f.value | escape }}</dd></div>
        {%- endfor %}
      </dl>
    </div>
  </div>
</section>
