<section id="about" class="section">
  <h2>About</h2>
  <p class="lead">{{ profile.about_intro | escape | newline_to_br }}</p>
  <div class="about-grid">
    <img class="about-photo" src="{{ profile.photo | relative_url }}" alt="{{ profile.name | escape }}" loading="lazy">
    <div>
      <h3>{{ profile.about_heading | escape }}</h3>
      <dl class="facts">
        {%- for f in profile.facts %}
        <div><dt>{{ f.label | escape }}</dt><dd>{{ f.value | escape }}</dd></div>
        {%- endfor %}
      </dl>
      <p>{{ profile.about_text | escape | newline_to_br }}</p>
    </div>
  </div>
</section>
